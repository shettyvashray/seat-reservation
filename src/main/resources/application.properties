spring.application.name=seat-reservation

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seat_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

management.endpoint.health.show-details=never

logging.pattern.correlation=[%X{requestId}]

app.security.admin-token=${ADMIN_TOKEN:dev-admin-token}